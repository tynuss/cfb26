name: Fan attitude history

# One-off: score every past week of these seasons so fan attitude can be backtested. Safe to re-run; it skips team-weeks already saved.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        season: [2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow vaderSentiment
      - name: Score each week's coverage
        run: python fan_sentiment.py history ${{ matrix.season }}
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sentiment
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fan attitude history ${{ matrix.season }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*7)); done
          exit 1
